
name: Update China IP Groups

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:30 执行（UTC 00:30）
    - cron: "30 0 * * *"
  push:
    paths:
      - "scripts/update_ipgroup.py"
      - ".github/workflows/update-ipgroup.yml"

permissions:
  contents: write

concurrency:
  group: update-ipgroup
  cancel-in-progress: false

jobs:
  update-ipgroup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CN-1 to CN-9
        run: python scripts/update_ipgroup.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ipgroup.csv tmp/ipgroup.csv

          if git diff --cached --quiet; then
            echo "IP group data unchanged."
          else
            git commit -m "chore: update China IP groups"
            git push origin HEAD:master
          fi
